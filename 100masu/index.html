</style></head><body><canvas id="fx"></canvas><div class="toast" id="toast">スタート！</div><main><div class="hero"><div><span class="tag">✦ 100 QUESTIONS CHALLENGE</span><h1>100マスチャレンジ</h1><p class="sub">100問ぜんぶ埋めたら、自動で答え合わせ！</p></div><div class="brain">🧠</div></div><div class="tools"><div class="box modes"><button class="mode on" data-m="add">＋ たし算</button><button class="mode" data-m="mul">× かけ算</button></div><div class="box"><div class="lab">TIME</div><div class="val" id="time">0:00.0</div></div><div class="box"><div class="lab">のこり</div><div class="val"><span id="left">100</span>問</div></div><div class="box"><div class="lab">BEST</div><div class="val" id="best">—</div></div></div><div class="prog" id="prog"><div class="track"><div class="bar" id="bar"></div></div><div class="pt" id="pt">0 / 100</div></div><section class="card"><div class="grid" id="grid"></div><div class="actions"><button class="btn light" id="clear">↺ 答えだけ消す</button><button class="btn strong" id="new">✦ 新しい問題</button></div><p class="hint">最初の入力でタイマー開始。100マス入力すると自動採点。Enter・矢印キーでも移動できます。</p></section></main><div class="modal" id="modal"><div class="result"><div class="icon" id="icon">🏆</div><h2 id="rt">PERFECT!</h2><div class="rsub" id="rsub">100マス 全問正解</div><div class="score"><span id="score">100</span><small> / 100</small></div><div class="rstats"><div class="rs"><small>タイム</small><b id="rtime">0:00.0</b></div><div class="rs"><small>1問あたり</small><b id="per">0.0秒</b></div></div><p class="note" id="note"></p><div class="ra"><button class="btn light" id="close">答えを見る</button><button class="btn strong" id="again">もう1回</button></div></div></div><script>
(()=>{'use strict';const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)],G=$('#grid'),T=$('#time'),L=$('#left'),B=$('#best'),BAR=$('#bar'),PT=$('#pt'),P=$('#prog'),M=$('#modal'),C=$('#fx'),X=C.getContext('2d');let mode='add',top=[],side=[],ins=[],start=null,elapsed=0,timer=null,graded=false,prev=0,parts=[],raf=null;const sh=a=>{a=[...a];for(let i=a.length-1;i;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a},fmt=ms=>{let s=Math.max(0,ms)/1000,m=Math.floor(s/60),q=String(Math.floor(s%60)).padStart(2,'0');return`${m}:${q}.${Math.floor(s*10)%10}`},ans=(r,c)=>mode==='add'?side[r]+top[c]:side[r]*top[c];function toast(s){let e=$('#toast');e.textContent=s;e.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('show'),850)}function best(){let v=+localStorage.getItem('m100_'+mode);B.textContent=v?fmt(v):'—'}function stop(){clearInterval(timer);timer=null;if(start!==null)elapsed=performance.now()-start;T.textContent=fmt(elapsed)}function resetTime(){clearInterval(timer);timer=null;start=null;elapsed=0;T.textContent='0:00.0'}function go(){if(start!==null||graded)return;start=performance.now();timer=setInterval(()=>{elapsed=performance.now()-start;T.textContent=fmt(elapsed)},80);toast('スタート！')}function cell(cls,t=''){let d=document.createElement('div');d.className='c '+cls;if(t!=='')d.textContent=t;return d}function unhi(){$$('.focus,.axis').forEach(e=>e.classList.remove('focus','axis'))}function hi(r,c,w){unhi();w.classList.add('focus');$(`.th[data-c="${c}"]`)?.classList.add('axis');$(`.sh[data-r="${r}"]`)?.classList.add('axis');$$(`.ans[data-r="${r}"],.ans[data-c="${c}"]`).forEach(e=>e.classList.add('axis'))}function render(){G.innerHTML='';ins=[];G.append(cell('corner',mode==='add'?'＋':'×'));top.forEach((n,c)=>{let h=cell('head th',n);h.dataset.c=c;G.append(h)});for(let r=0;r<10;r++){let h=cell('head sh',side[r]);h.dataset.r=r;G.append(h);for(let c=0;c<10;c++){let w=cell('ans');w.dataset.r=r;w
